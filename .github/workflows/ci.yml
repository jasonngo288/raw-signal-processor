name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build -c release
      - name: Build RawCore + CaptureKit for iOS (compile check; no device in CI)
        run: |
          set -o pipefail
          for scheme in RawCore CaptureKit; do
            xcodebuild build -scheme "$scheme" -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO -quiet 2>&1 | tail -40
          done
      - name: Demo app (XcodeGen → xcodebuild for iOS, no signing)
        run: |
          set -o pipefail
          brew install xcodegen >/dev/null
          cd App && xcodegen generate
          # The committed project lists files one by one: new Swift files must be in it (user's Xcode build broke on
          # Presets2026.swift / ToneMatch.swift). Fail if the committed project is stale.
          xcodebuild build -project RawFilmDemo.xcodeproj -scheme RawFilmDemo -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO -quiet 2>&1 | tail -40
          tar czf ../xcodeproj.tgz RawFilmDemo.xcodeproj RawFilmDemo/Info.plist
          echo "XCODEPROJ_BEGIN"; base64 -i ../xcodeproj.tgz | fold -w 4000; echo "XCODEPROJ_END"
      - name: Test
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log
      - name: Gate 1 lines
        if: always()
        run: grep '\[gate1\]' test.log || true
      - name: Decoder info for originals
        run: |
          mkdir -p bench-out
          for f in originals/BVQX5524.DNG; do
            [ -e "$f" ] || continue
            echo "=== $f"; .build/release/raw-bench info "$f" | tee "bench-out/$(basename "$f").info.json"
          done
      - name: Cache public RAW corpus
        uses: actions/cache@v4
        with:
          path: corpus-cache
          key: corpus-${{ hashFiles('corpus/corpus.json') }}
      - name: Fetch public RAW corpus (CC-BY-SA, not committed)
        continue-on-error: true
        run: python3 scripts/fetch_corpus.py corpus/corpus.json corpus-cache
      - name: Bench originals + corpus
        run: .build/release/raw-bench bench originals corpus-cache --manifest corpus/corpus.json --out bench-out --long-edge 1024 --crops
      - name: Device pairs (output/, our render vs the camera HEIC)
        if: always()
        run: .build/release/raw-bench pairs output docs --out bench-out/pairs --long-edge 1024
      - name: DNG tags of files CIRAWFilter could not open
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          # Report-only step. It runs with if: always(), so when an earlier step failed the bench never wrote its summary:
          # say so instead of failing with a traceback (the earlier failure is already the job's result).
          if not os.path.exists("bench-out/summary.json"):
              print("bench-out/summary.json not found: the bench step did not run (an earlier step failed); nothing to report")
              sys.exit(0)
          for f in json.load(open("bench-out/summary.json")):
              if f.get("error"):
                  path = ("corpus-cache/" if f.get("corpus", {}).get("location") != "originals" else "originals/") + f["file"]
                  print("=== " + f["file"] + ": " + f["error"])
                  out = subprocess.run(["python3", "scripts/dng_tags.py", path], capture_output=True, text=True).stdout
                  keep = ("==", "Compression", "Photometric", "DNGVersion", "Model", "Software", "BitsPerSample", "SamplesPerPixel", "NewSubFileType", "ImageWidth")
                  print("\n".join(l for l in out.splitlines() if l.strip().startswith(keep))[:6000])
          PY
      - name: Previews in log (artifact storage is not reachable from the dev container)
        if: always()
        run: |
          mkdir -p previews
          for f in bench-out/*.jpg; do [ -e "$f" ] && sips -Z 720 -s formatOptions 72 "$f" --out "previews/$(basename "$f")" >/dev/null; done
          for f in bench-out/pairs/*.jpg; do [ -e "$f" ] && sips -Z 720 -s formatOptions 72 "$f" --out "previews/$(basename "$f")" >/dev/null; done
          cp bench-out/summary.md bench-out/summary.json bench-out/pairs/pairs.md previews/ 2>/dev/null || true
          tar czf previews.tgz previews
          echo "PREVIEWS_BEGIN"; base64 -i previews.tgz | fold -w 4000; echo "PREVIEWS_END"
      - name: Committed Xcode project is up to date (last, so tests and bench still run when it is stale)
        if: always()
        run: |
          cd App
          if ! git diff --quiet -- RawFilmDemo.xcodeproj; then
            echo "::error::App/RawFilmDemo.xcodeproj is stale: regenerate (cd App && xcodegen generate) or take it from XCODEPROJ in this log"
            git diff --stat -- RawFilmDemo.xcodeproj; exit 1
          fi
      - name: Job summary
        if: always()
        run: |
          [ -f bench-out/summary.md ] && cat bench-out/summary.md >> "$GITHUB_STEP_SUMMARY"
          grep '\[gate1\]' test.log >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-out
          path: |
            bench-out
            test.log
